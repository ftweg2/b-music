upstream bmusic_app {
    server 127.0.0.1:13100;
    keepalive 8;
}
server {
    listen 80;
    listen [::]:80;
    server_name bmusic.ftwegc.com;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/bmusic/acme; }
    location / { return 301 https://bmusic.ftwegc.com$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bmusic.ftwegc.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/bmusic.ftwegc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bmusic.ftwegc.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BMUSIC_SSL:1m;
    ssl_session_timeout 1d;
    auth_basic off;
    client_max_body_size 128k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    access_log /var/log/nginx/bmusic-access.log;
    error_log /var/log/nginx/bmusic-error.log warn;
    location / {
        proxy_pass http://bmusic_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
