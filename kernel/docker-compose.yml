services:
  kernel:
    build: .
    container_name: bili-ctf-audio-kernel
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: "512mb"
    env_file:
      - path: .env
        required: false
    ports:
      - "${KERNEL_BIND_HOST:-127.0.0.1}:${KERNEL_PORT:-8000}:8000"
    volumes:
      - ./storage:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
