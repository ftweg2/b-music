services:
  kernel:
    build: .
    container_name: bili-ctf-audio-kernel
    env_file:
      - .env
    ports:
      - "${KERNEL_PORT:-8000}:8000"
    volumes:
      - ./storage:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
